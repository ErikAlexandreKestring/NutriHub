# Análise do SonarCloud (workflow .github/workflows/sonarcloud.yml).
# A organização e a chave são as que o SonarCloud cria ao importar o
# repositório do GitHub.
sonar.organization=erikalexandrekestring
sonar.projectKey=ErikAlexandreKestring_NutriHub
sonar.projectName=Nutri-Hub

sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/__tests__/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.exclusions=frontend/src/**/__tests__/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# As migrations e os seeds (como a tabela TACO) são dados, não lógica: ficam
# fora da cobertura e da detecção de duplicação.
sonar.coverage.exclusions=backend/src/server.ts,backend/src/shared/observability/iniciar.ts,backend/src/shared/observability/iniciar.ts,backend/src/db/migrations/**,backend/src/db/seeds/**,backend/src/types/**,backend/src/db/knexfile.ts,frontend/src/main.tsx,frontend/src/vite-env.d.ts
sonar.cpd.exclusions=backend/src/db/migrations/**,backend/src/db/seeds/**

# Cobertura somada: testes unitários e de integração do backend e Vitest do
# frontend.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage/integracao/lcov.info,frontend/coverage/lcov.info
